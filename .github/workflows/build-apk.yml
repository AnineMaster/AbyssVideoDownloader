          package com.abmo.providers

          import com.abmo.services.HttpClientManager
          import com.abmo.util.fetchDocument
          import com.abmo.util.getParameter
          import com.abmo.util.toJsoupDocument
          import org.koin.core.component.KoinComponent
          import org.koin.core.component.inject

          class Animet3Provider : Provider, KoinComponent {
              private val httpClientManager: HttpClientManager by inject()
              override fun getVideoID(url: String): String? {
                  val regex = Regex("""MovieId\s*=\s*'(\d+)',\s*EpisodeId\s*=\s*'(\d+)',""")
                  val matchResult = regex.find(url.fetchDocument().html()) ?: return null
                  val response = httpClientManager.postForm(
                      "https://anime11.site/ajax/player_hrx",
                      "id=${matchResult.groupValues[1]}&ep=${matchResult.groupValues[2]}&sv=hrx-0"
                  )
                  return response.toJsoupDocument().select("iframe").attr("src").getParameter("v")
              }
          }
