name: Auto Patch and Build Android APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Forked Repo
        uses: actions/checkout@v4

      - name: Auto-Patch Project for Android
        run: |
          mkdir -p 
          sed -i 's/gradle-8.5-bin.zip/gradle-8.6-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          src/main/kotlin/com/abmo/services
          src/main/kotlin/com/abmo/providers

          cat << 'EOF' > settings.gradle.kts
