          cat << 'EOF' > src/main/kotlin/com/abmo/services/HttpClientManager.kt
          package com.abmo.services

          import com.abmo.common.Logger
          import com.abmo.model.HttpResponse
          import com.github.zhkl0228.impersonator.ImpersonatorFactory
          import com.google.gson.JsonParser
          import okhttp3.Dns
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.net.InetAddress
          import java.net.UnknownHostException
          import java.security.KeyStore
          import java.util.concurrent.TimeUnit
          import javax.net.ssl.TrustManagerFactory
          import javax.net.ssl.X509TrustManager

          class HttpClientManager {
              companion object {
                  private const val IOS_UA =
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1"
                  private const val CHROME_UA =
                      "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"
              }

              private val dohClient: OkHttpClient by lazy {
                  OkHttpClient.Builder()
                      .connectTimeout(10, TimeUnit.SECONDS)
                      .readTimeout(10, TimeUnit.SECONDS)
                      .build()
              }

              private val smartDns = object : Dns {
                  override fun lookup(hostname: String): List<InetAddress> {
                      try {
                          val sys = Dns.SYSTEM.lookup(hostname)
                          if (sys.isNotEmpty() && sys.none { it.hostAddress == "0.0.0.0" || it.hostAddress == "127.0.0.1" }) {
                              return sys
                          }
                      } catch (_: Throwable) {}

                      try {
                          val req = Request.Builder()
                              .url("https://dns.google/resolve?name=$hostname&type=A")
                              .build()
                          val body = dohClient.newCall(req).execute().use { it.body?.string().orEmpty() }
                          val json = JsonParser.parseString(body).asJsonObject
                          val answers = json.getAsJsonArray("Answer")
                          val ips = mutableListOf<InetAddress>()
                          answers?.forEach { el ->
                              val obj = el.asJsonObject
                              if (obj.get("type")?.asInt == 1) {
                                  val ip = obj.get("data")?.asString
                                  if (!ip.isNullOrBlank()) ips.add(InetAddress.getByName(ip))
                              }
                          }
                          if (ips.isNotEmpty()) return ips
                      } catch (_: Throwable) {}

                      throw UnknownHostException("DNS failed for $hostname")
                  }
              }

              private val impersonatedClient: OkHttpClient? by lazy {
                  try {
                      val tmf = TrustManagerFactory.getInstance(TrustManagerFactory.getDefaultAlgorithm()).apply {
                          init(null as KeyStore?)
                      }
                      val trustManagers = tmf.trustManagers
                      val x509Tm = trustManagers.filterIsInstance<X509TrustManager>().first()
                      val api = ImpersonatorFactory.ios()
                      val sslContext = api.newSSLContext(null, trustManagers)
                      OkHttpClient.Builder()
                          .dns(smartDns)
                          .sslSocketFactory(sslContext.socketFactory, x509Tm)
                          .connectTimeout(20, TimeUnit.SECONDS)
                          .readTimeout(30, TimeUnit.SECONDS)
                          .build()
                  } catch (_: Throwable) {
                      null
                  }
              }

              private val standardClient: OkHttpClient by lazy {
                  OkHttpClient.Builder()
                      .dns(smartDns)
                      .connectTimeout(20, TimeUnit.SECONDS)
                      .readTimeout(60, TimeUnit.SECONDS)
                      .build()
              }

              fun makeHttpRequest(url: String, headers: Map<String, String?>? = null): HttpResponse? {
                  return makeHttpRequestDetailed(url, headers).first
              }

              fun makeHttpRequestDetailed(url: String, headers: Map<String, String?>? = null): Pair<HttpResponse?, String?> {
                  Logger.debug("Initiating http request to $url")
                  var bctlsErr: String? = null
                  impersonatedClient?.let { client ->
                      try {
                          val builder = Request.Builder()
                              .url(url)
                              .header("User-Agent", IOS_UA)
                              .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                              .header("Accept-Language", "en-US,en;q=0.9")
                          headers?.forEach { (key, value) ->
                              if (!value.isNullOrBlank()) builder.header(key, value)
                          }
                          client.newCall(builder.build()).execute().use { response ->
                              val body = response.body?.string()
                              if (response.code == 200 && !body.isNullOrBlank()) {
                                  return HttpResponse(body = body, statusCode = response.code) to null
                              }
                              bctlsErr = "iOS-TLS HTTP ${response.code}"
                          }
                      } catch (e: Throwable) {
                          bctlsErr = "iOS-TLS ${e.javaClass.simpleName}: ${e.message}"
                      }
                  }

                  return try {
                      val builder = Request.Builder()
                          .url(url)
                          .header("User-Agent", CHROME_UA)
                          .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                          .header("Accept-Language", "en-US,en;q=0.9")
                      headers?.forEach { (key, value) ->
                          if (!value.isNullOrBlank()) builder.header(key, value)
                      }
                      standardClient.newCall(builder.build()).execute().use { response ->
                          HttpResponse(body = response.body?.string(), statusCode = response.code) to bctlsErr
                      }
                  } catch (e: Throwable) {
                      val msg = "${e.javaClass.simpleName}: ${e.message}" + (if (bctlsErr != null) " | $bctlsErr" else "")
                      null to msg
                  }
              }

              fun postForm(url: String, formBody: String, headers: Map<String, String> = emptyMap()): String {
                  val mediaType = "application/x-www-form-urlencoded; charset=UTF-8".toMediaType()
                  val builder = Request.Builder()
                      .url(url)
                      .header("User-Agent", CHROME_UA)
                      .post(formBody.toRequestBody(mediaType))
                  headers.forEach { (k, v) -> builder.header(k, v) }
                  return standardClient.newCall(builder.build()).execute().use { it.body?.string().orEmpty() }
              }

              fun openSegmentStream(url: String, referer: String = "https://abysscdn.com/"): okhttp3.Response {
                  val request = Request.Builder()
                      .url(url)
                      .header("User-Agent", CHROME_UA)
                      .header("Referer", referer)
                      .build()
                  return standardClient.newCall(request).execute()
              }
          }
          EOF

          cat << 'EOF' > src/main/kotlin/com/abmo/services/VideoDownloader.kt
          package com.abmo.services

          import com.abmo.crypto.CryptoHelper
          import com.abmo.model.Config
          import com.abmo.model.Datas
          import com.abmo.model.SimpleVideo
          import com.abmo.model.video.Mp4
          import com.abmo.model.video.Video
          import com.abmo.model.video.toSimpleVideo
          import com.abmo.util.toObject
          import kotlinx.coroutines.*
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit
          import org.jsoup.Jsoup
          import org.koin.core.component.KoinComponent
          import org.koin.core.component.inject
          import java.io.BufferedOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.IOException
          import java.util.Base64
          import java.util.concurrent.atomic.AtomicInteger
          import java.util.concurrent.atomic.AtomicLong

          class VideoDownloader : KoinComponent {
              private val cryptoHelper: CryptoHelper by inject()
              private val httpClientManager: HttpClientManager by inject()

              companion object {
                  private const val FRAGMENT_SIZE_IN_BYTES = 2097152L
                  private const val MAX_RETRIES = 3
              }

              suspend fun downloadSegmentsInParallel(
                  config: Config,
                  videoMetadata: Mp4?,
                  onProgress: ((percent: Int, downloadedBytes: Long, totalBytes: Long, speedBytesPerSec: Long, status: String) -> Unit)? = null
              ) {
                  val simpleVideo = videoMetadata?.toSimpleVideo(config.resolution)
                      ?: throw IOException("Selected quality not found")
                  val segmentTokens = generateSegmentTokens(simpleVideo)
                  if (segmentTokens.isEmpty()) throw IOException("Failed to generate download tokens")

                  val tempDir = initializeDownloadTempDir(config, simpleVideo, segmentTokens.size)
                  val segmentsToDownload = segmentTokens.filter { (index, _) -> index in tempDir.second }.ifEmpty {
                      segmentTokens
                  }

                  val semaphore = Semaphore(config.connections)
                  val totalSegments = segmentTokens.size
                  val mediaSize = simpleVideo.size ?: (totalSegments * FRAGMENT_SIZE_IN_BYTES)
                  val alreadyDownloadedSegments = totalSegments - segmentsToDownload.size
                  val downloadedSegments = AtomicInteger(alreadyDownloadedSegments)
                  val totalBytesDownloaded = AtomicLong(alreadyDownloadedSegments * FRAGMENT_SIZE_IN_BYTES)
                  val startTime = System.currentTimeMillis()

                  coroutineScope {
                      val downloadJobs = segmentsToDownload.entries.map { segmentToken ->
                          val segmentUrl = "${simpleVideo.url}/sora/${simpleVideo.size}/${segmentToken.value}"
                          async(Dispatchers.IO) {
                              val index = segmentToken.key
                              semaphore.withPermit {
                                  downloadSegmentWithRetry(segmentUrl, File(tempDir.first, "segment_$index"), totalBytesDownloaded)
                              }
                              downloadedSegments.incrementAndGet()
                          }
                      }

                      val progressJob = launch {
                          while (isActive) {
                              val downloaded = totalBytesDownloaded.get().coerceAtMost(mediaSize)
                              val elapsedSec = ((System.currentTimeMillis() - startTime) / 1000.0).coerceAtLeast(0.5)
                              val speed = (downloaded / elapsedSec).toLong()
                              val pct = if (mediaSize > 0) ((downloaded * 100) / mediaSize).toInt().coerceIn(0, 99) else 0
                              onProgress?.invoke(pct, downloaded, mediaSize, speed, "Downloading (${downloadedSegments.get()}/$totalSegments chunks)...")
                              delay(500)
                          }
                      }

                      try {
                          downloadJobs.awaitAll()
                      } finally {
                          progressJob.cancel()
                      }
                  }

                  onProgress?.invoke(99, mediaSize, mediaSize, 0L, "Merging video chunks...")
                  config.outputFile?.let { mergeSegmentsIntoMp4File(tempDir.first, it) }
                  onProgress?.invoke(100, mediaSize, mediaSize, 0L, "Saving to Downloads...")
              }

              private suspend fun downloadSegmentWithRetry(url: String, targetFile: File, bytesCounter: AtomicLong) {
                  var lastError: Throwable? = null
                  repeat(MAX_RETRIES) { attempt ->
                      try {
                          if (targetFile.exists()) targetFile.delete()
                          httpClientManager.openSegmentStream(url).use { response ->
                              if (!response.isSuccessful) throw IOException("HTTP ${response.code}")
                              val bodyStream = response.body?.byteStream() ?: throw IOException("Empty segment body")
                              FileOutputStream(targetFile).use { fos ->
                                  val buffer = ByteArray(65536)
                                  var read: Int
                                  while (bodyStream.read(buffer).also { read = it } != -1) {
                                      fos.write(buffer, 0, read)
                                      bytesCounter.addAndGet(read.toLong())
                                  }
                              }
                          }
                          return
                      } catch (e: Throwable) {
                          lastError = e
                          if (attempt < MAX_RETRIES - 1) delay(1000L * (attempt + 1))
                      }
                  }
                  throw lastError ?: IOException("Segment download failed")
              }

              private fun mergeSegmentsIntoMp4File(segmentFolderPath: File, output: File) {
                  val segmentFiles = segmentFolderPath.listFiles { file -> file.name.startsWith("segment_") }
                      ?.toList()
                      ?.sortedBy { it.name.removePrefix("segment_").toIntOrNull() }
                      ?: emptyList()
                  if (segmentFiles.isEmpty()) throw IOException("No downloaded chunks found")

                  BufferedOutputStream(FileOutputStream(output), 262144).use { out ->
                      val buffer = ByteArray(65536)
                      for (seg in segmentFiles) {
                          FileInputStream(seg).use { input ->
                              var read: Int
                              while (input.read(buffer).also { read = it } != -1) {
                                  out.write(buffer, 0, read)
                              }
                          }
                      }
                      out.flush()
                  }
                  segmentFolderPath.listFiles()?.forEach { it.delete() }
                  segmentFolderPath.delete()
              }

              fun getVideoMetaData(url: String, headers: Map<String, String?>?): Mp4? {
                  return getVideoMetaDataDetailed(url, headers).first
              }

              fun getVideoMetaDataDetailed(url: String, headers: Map<String, String?>?): Pair<Mp4?, String> {
                  val attempts = listOfNotNull(
                      headers,
                      mapOf("Referer" to "https://abyss.to/"),
                      mapOf("Referer" to "https://abysscdn.com/"),
                      emptyMap()
                  ).distinct()

                  var lastDiag = "No response"
                  for (hdrs in attempts) {
                      val (resp, err) = httpClientManager.makeHttpRequestDetailed(url, hdrs)
                      if (resp == null) {
                          lastDiag = err ?: "Network error"
                          continue
                      }
                      val body = resp.body.orEmpty()
                      if (resp.statusCode == 200 && body.isNotBlank()) {
                          val parsed = parseHtmlToMetadata(body)
                          if (parsed != null) return parsed to "OK"
                          val title = try { Jsoup.parse(body).title() } catch (_: Throwable) { "" }
                          lastDiag = "HTTP 200 (no 'datas' found, title='$title')"
                      } else {
                          val title = try { Jsoup.parse(body).title() } catch (_: Throwable) { "" }
                          lastDiag = "HTTP ${resp.statusCode} (title='$title')"
                      }
                  }
                  return null to lastDiag
              }

              fun parseHtmlToMetadata(html: String): Mp4? {
                  return try {
                      val jsCode = Jsoup.parse(html).select("script").find { it.html().contains("datas") }?.html() ?: return null
                      val datasRegex = Regex("""(?:const|let|var)?\s*datas\s*=\s*["']([^"']+)["']""")
                      val datas = datasRegex.find(jsCode)?.groups?.get(1)?.value ?: return null
                      val decodedDatas = String(Base64.getDecoder().decode(datas), Charsets.ISO_8859_1)
                      val mediaMetadata = decodedDatas.toObject<Datas>()
                      val encryptedMediaMetadata = mediaMetadata.media ?: return null

                      val mediaKey = "${mediaMetadata.user_id}:${mediaMetadata.slug}:${mediaMetadata.md5_id}"
                      val decryptionKey = cryptoHelper.getKey(mediaKey).toByteArray()
                      cryptoHelper.decryptString(encryptedMediaMetadata, decryptionKey)
                          .toObject<Video>()
                          .mp4?.copy(slug = mediaMetadata.slug, md5_id = mediaMetadata.md5_id)
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun initializeDownloadTempDir(config: Config, simpleVideo: SimpleVideo?, totalSegments: Int): Pair<File, List<Int>> {
                  val tempFolderName = "temp_${simpleVideo?.slug}_${simpleVideo?.label}"
                  val tempFolder = File(config.outputFile?.parentFile, tempFolderName)
                  if (tempFolder.exists() && tempFolder.isDirectory) {
                      val existingSegments = tempFolder.listFiles { file ->
                          if (file.isFile && file.name.matches(Regex("segment_\\d+")) && file.length() < FRAGMENT_SIZE_IN_BYTES) {
                              file.delete()
                          }
                          file.isFile && file.name.matches(Regex("segment_\\d+"))
                      }?.mapNotNull { it.name.removePrefix("segment_").toIntOrNull() }?.toSet() ?: emptySet()
                      return tempFolder to (0 until totalSegments).filterNot { it in existingSegments }
                  } else {
                      tempFolder.mkdirs()
                  }
                  return tempFolder to emptyList()
              }

              private fun generateRanges(size: Long, step: Long = FRAGMENT_SIZE_IN_BYTES): List<LongRange> {
                  val ranges = mutableListOf<LongRange>()
                  if (size <= step) {
                      ranges.add(0 until size)
                      return ranges
                  }
                  var start = 0L
                  while (start < size) {
                      val end = minOf(start + step, size)
                      ranges.add(start until end)
                      start = end
                  }
                  return ranges
              }

              private fun generateSegmentTokens(simpleVideo: SimpleVideo?): Map<Int, String> {
                  val fragmentList = mutableMapOf<Int, String>()
                  val encryptionKey = cryptoHelper.getKey(simpleVideo?.size)
                  if (simpleVideo?.size != null) {
                      generateRanges(simpleVideo.size).forEachIndexed { index, _ ->
                          val path = "/mp4/${simpleVideo.md5_id}/${simpleVideo.resId}/${simpleVideo.size}/$FRAGMENT_SIZE_IN_BYTES/$index"
                          val encryptedBody = cryptoHelper.encryptAESCTR(path, encryptionKey)
                          fragmentList[index] = doubleEncodeToBase64(encryptedBody)
                      }
                      return fragmentList
                  }
                  return emptyMap()
              }

              private fun doubleEncodeToBase64(input: String): String {
                  val first = Base64.getEncoder().encodeToString(input.toByteArray(Charsets.ISO_8859_1)).replace("=", "")
                  return Base64.getEncoder().encodeToString(first.toByteArray()).replace("=", "")
              }
          }
          EOF

