          mkdir -p src/main/kotlin/com/abmo/services src/main/kotlin/com/abmo/providers src/main/res/drawable src/main/res/mipmap-anydpi-v26
          sed -i 's/gradle-8.5-bin.zip/gradle-8.6-bin.zip/g' gradle/wrapper/gradle-wrapper.properties

          cat << 'EOF' > settings.gradle.kts
