          package com.abmo.providers

          import com.abmo.util.getHost
          import com.abmo.util.getParameter

          class AbyssToProvider : Provider {
              override fun getVideoID(url: String): String? {
                  val cleanUrl = url.trim()
                  val host = cleanUrl.getHost().lowercase().removePrefix("www.")
                  return when {
                      host in listOf("abysscdn.com", "abyss.to", "playhydrax.com", "zplayer.io", "hydrax.net") -> {
                          cleanUrl.getParameter("v")
                              ?: cleanUrl.substringBefore("?").trimEnd('/').substringAfterLast("/")
                      }
                      host == "short.ink" -> cleanUrl.substringBefore("?").trimEnd('/').substringAfterLast("/")
                      cleanUrl.startsWith("http://") || cleanUrl.startsWith("https://") -> {
                          cleanUrl.getParameter("v")
                              ?: cleanUrl.substringBefore("?").trimEnd('/').substringAfterLast("/")
                      }
                      else -> cleanUrl
                  }
              }
          }
