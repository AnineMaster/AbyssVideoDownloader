          package com.abmo.providers

          import com.abmo.executor.JavaScriptExecutor
          import com.abmo.util.fetchDocument

          class TvphimProvider(private val javaScriptExecutor: JavaScriptExecutor) : Provider {
              override fun getVideoID(url: String): String? {
                  val hProUrl = url.fetchDocument().select("a[title=\"Server H.PRO\"]").attr("href")
                  if (hProUrl.isNullOrBlank()) return null
                  val jsCode = hProUrl.fetchDocument().select("div[class=absolute inset-0]").select("script").html()
                  return javaScriptExecutor.runJavaScriptCode(
                      javascriptFileName = "tvphim.js",
                      identifier = "extractVideoID",
                      arguments = arrayOf(jsCode)
                  )
              }
          }
