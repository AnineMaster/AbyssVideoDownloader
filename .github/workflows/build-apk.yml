          cat << 'EOF' > src/main/kotlin/com/abmo/MainActivity.kt
          package com.abmo

          import android.Manifest
          import android.app.Activity
          import android.content.ClipboardManager
          import android.content.ContentValues
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import com.abmo.common.Constants.ABYSS_BASE_URL
          import com.abmo.di.koinModule
          import com.abmo.model.Config
          import com.abmo.model.video.Mp4
          import com.abmo.model.video.Source
          import com.abmo.services.ProviderDispatcher
          import com.abmo.services.VideoDownloader
          import com.abmo.util.extractReferer
          import com.abmo.util.formatAsReadableSize
          import com.abmo.util.isValidUrl
          import com.google.gson.Gson
          import kotlinx.coroutines.*
          import org.koin.core.context.GlobalContext
          import org.koin.core.context.startKoin
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import kotlin.coroutines.resume

          class MainActivity : Activity() {
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private lateinit var urlInput: EditText
              private lateinit var threadsText: TextView
              private lateinit var threadsSeekBar: SeekBar
              private lateinit var fetchBtn: Button
              private lateinit var formatsContainer: LinearLayout
              private lateinit var statusText: TextView
              private lateinit var progressBar: ProgressBar
              private lateinit var progressDetailText: TextView

              private var currentMetadata: Mp4? = null
              private var currentAbyssUrl: String = ""
              private var currentHeaders: Map<String, String> = emptyMap()
              private var currentVideoId: String = ""
              private var isDownloading = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      if (GlobalContext.getOrNull() == null) {
                          startKoin { modules(koinModule) }
                      }
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                          if (checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE), 101)
                          }
                      }
                      buildUi()
                  } catch (e: Throwable) {
                      val errView = TextView(this).apply {
                          setPadding(40, 80, 40, 40)
                          setTextColor(Color.RED)
                          text = "Startup Error:\n${e.stackTraceToString()}"
                      }
                      setContentView(ScrollView(this).apply { addView(errView) })
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
              private fun cardBg(colorHex: String, radiusDp: Int = 14) = GradientDrawable().apply {
                  setColor(Color.parseColor(colorHex))
                  cornerRadius = dp(radiusDp).toFloat()
              }

              private fun buildUi() {
                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      isFillViewport = true
                  }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(28), dp(20), dp(28))
                  }
                  val title = TextView(this).apply {
                      text = "CDdm"
                      textSize = 26f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                  }
                  val subtitle = TextView(this).apply {
                      text = "All qualities up to 4K • Multi-thread high speed • Downloads/CDdm"
                      textSize = 13f
                      setTextColor(Color.parseColor("#94A3B8"))
                      setPadding(0, dp(4), 0, dp(18))
                  }
                  urlInput = EditText(this).apply {
                      hint = "Paste Abyss URL or Video ID (e.g. K8R6OOjS7)"
                      setHintTextColor(Color.parseColor("#64748B"))
                      setTextColor(Color.WHITE)
                      background = cardBg("#1E293B", 12)
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      isSingleLine = true
                  }
                  val btnRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(10), 0, dp(14))
                  }
                  val pasteBtn = Button(this).apply {
                      text = "Paste"
                      setTextColor(Color.WHITE)
                      background = cardBg("#334155", 10)
                      layoutParams = LinearLayout.LayoutParams(0, dp(48), 1f).apply { rightMargin = dp(8) }
                      setOnClickListener {
                          try {
                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              val clip = cm.primaryClip
                              if (clip != null && clip.itemCount > 0) {
                                  val txt = clip.getItemAt(0).coerceToText(this@MainActivity)?.toString()?.trim()
                                  if (!txt.isNullOrEmpty()) urlInput.setText(txt)
                              }
                          } catch (_: Throwable) {}
                      }
                  }
                  fetchBtn = Button(this).apply {
                      text = "Fetch Qualities"
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      background = cardBg("#2563EB", 10)
                      layoutParams = LinearLayout.LayoutParams(0, dp(48), 2f)
                      setOnClickListener { fetchFormats() }
                  }
                  btnRow.addView(pasteBtn)
                  btnRow.addView(fetchBtn)

                  val threadCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cardBg("#1E293B", 12)
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                  }
                  threadsText = TextView(this).apply {
                      text = "Download Speed Threads: 8 (High Speed)"
                      textSize = 14f
                      setTextColor(Color.parseColor("#E2E8F0"))
                  }
                  threadsSeekBar = SeekBar(this).apply {
                      max = 9
                      progress = 7
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                              val t = p + 1
                              threadsText.text = "Download Speed Threads: $t ${if (t >= 8) "(High Speed)" else ""}"
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {}
                      })
                  }
                  threadCard.addView(threadsText)
                  threadCard.addView(threadsSeekBar)

                  statusText = TextView(this).apply {
                      text = "Ready. Paste a link and tap Fetch Qualities."
                      textSize = 14f
                      setTextColor(Color.parseColor("#CBD5E1"))
                      setPadding(0, dp(16), 0, dp(8))
                  }
                  progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      progress = 0
                      visibility = View.GONE
                  }
                  progressDetailText = TextView(this).apply {
                      textSize = 13f
                      setTextColor(Color.parseColor("#38BDF8"))
                      setPadding(0, dp(4), 0, dp(12))
                      visibility = View.GONE
                  }
                  formatsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(8), 0, dp(16))
                  }
                  root.addView(title); root.addView(subtitle); root.addView(urlInput)
                  root.addView(btnRow); root.addView(threadCard); root.addView(statusText)
                  root.addView(progressBar); root.addView(progressDetailText); root.addView(formatsContainer)
                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun fetchFormats() {
                  if (isDownloading) return
                  val raw = urlInput.text.toString().trim()
                  if (raw.isEmpty()) {
                      Toast.makeText(this, "Enter a video URL or ID", Toast.LENGTH_SHORT).show()
                      return
                  }
                  formatsContainer.removeAllViews()
                  statusText.text = "Fetching available qualities..."
                  fetchBtn.isEnabled = false

                  scope.launch {
                      try {
                          val dispatcher = GlobalContext.get().get<ProviderDispatcher>()
                          val downloader = GlobalContext.get().get<VideoDownloader>()

                          val prep = withContext(Dispatchers.IO) {
                              val videoId = dispatcher.getProviderForUrl(raw).getVideoID(raw)?.trim()
                                  ?: throw Exception("Could not extract Video ID from: $raw")
                              val headers = if (raw.isValidUrl()) {
                                  mapOf("Referer" to (raw.extractReferer() ?: "$ABYSS_BASE_URL/"))
                              } else {
                                  mapOf("Referer" to "https://abyss.to/")
                              }
                              val abyssUrl = "$ABYSS_BASE_URL/?v=$videoId"
                              Triple(videoId, abyssUrl, headers)
                          }

                          currentVideoId = prep.first
                          currentAbyssUrl = prep.second
                          currentHeaders = prep.third

                          var (meta, diag) = withContext(Dispatchers.IO) {
                              downloader.getVideoMetaDataDetailed(currentAbyssUrl, currentHeaders)
                          }

                          if (meta == null) {
                              statusText.text = "Direct fetch ($diag). Trying browser engine..."
                              val webHtml = fetchHtmlViaWebView(currentAbyssUrl, currentHeaders["Referer"] ?: "https://abyss.to/")
                              if (!webHtml.isNullOrBlank()) {
                                  meta = withContext(Dispatchers.IO) { downloader.parseHtmlToMetadata(webHtml) }
                                  if (meta == null) {
                                      val webPreview = webHtml.replace(Regex("<[^>]+>"), " ").replace(Regex("\\s+"), " ").trim().take(120)
                                      diag = "$diag | WebView: $webPreview"
                                  }
                              } else {
                                  diag = "$diag | WebView: empty"
                              }
                          }

                          if (meta == null) {
                              statusText.text = "Failed [ID=$currentVideoId]: $diag"
                              return@launch
                          }

                          currentMetadata = meta
                          val sources = meta.sources?.filterNotNull()?.sortedByDescending { it.size ?: 0L } ?: emptyList()
                          if (sources.isEmpty()) {
                              statusText.text = "No downloadable formats found for ID=$currentVideoId."
                          } else {
                              statusText.text = "Found ${sources.size} format(s) for $currentVideoId. Tap one to download:"
                              sources.forEach { addFormatButton(it) }
                          }
                      } catch (e: Throwable) {
                          statusText.text = "Error: ${e.message ?: e.javaClass.simpleName}"
                      } finally {
                          fetchBtn.isEnabled = true
                      }
                  }
              }

              private suspend fun fetchHtmlViaWebView(url: String, referer: String): String? = withTimeoutOrNull(10000L) {
                  withContext(Dispatchers.Main) {
                      val webView = WebView(this@MainActivity)
                      try {
                          webView.settings.javaScriptEnabled = true
                          webView.settings.domStorageEnabled = true
                          var pageLoaded = false
                          webView.webViewClient = object : WebViewClient() {
                              override fun onPageFinished(view: WebView?, loadedUrl: String?) {
                                  pageLoaded = true
                              }
                          }
                          webView.loadUrl(url, mapOf("Referer" to referer))
                          val gson = Gson()
                          for (i in 0 until 16) {
                              delay(500)
                              if (pageLoaded || i >= 4) {
                                  val html = evalWebViewHtml(webView, gson)
                                  if (!html.isNullOrBlank() && html.contains("datas")) {
                                      return@withContext html
                                  }
                                  if (pageLoaded && i >= 6 && !html.isNullOrBlank() && !html.contains("Just a moment", ignoreCase = true)) {
                                      return@withContext html
                                  }
                              }
                          }
                          evalWebViewHtml(webView, gson)
                      } finally {
                          webView.stopLoading()
                          webView.destroy()
                      }
                  }
              }

              private suspend fun evalWebViewHtml(webView: WebView, gson: Gson): String? = suspendCancellableCoroutine { cont ->
                  webView.evaluateJavascript("(function(){ return document.documentElement ? document.documentElement.outerHTML : ''; })();") { raw ->
                      if (cont.isActive) {
                          val decoded = try {
                              if (raw == null || raw == "null") null else gson.fromJson(raw, String::class.java)
                          } catch (_: Throwable) { null }
                          cont.resume(decoded)
                      }
                  }
              }

              private fun addFormatButton(source: Source) {
                  val label = source.label ?: "Unknown"
                  val sizeStr = source.size.formatAsReadableSize()
                  val btn = Button(this).apply {
                      text = "Download $label  ($sizeStr)"
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      background = cardBg("#059669", 12)
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(52)).apply {
                          bottomMargin = dp(10)
                      }
                      setOnClickListener { startDownload(label) }
                  }
                  formatsContainer.addView(btn)
              }

              private fun startDownload(resolutionLabel: String) {
                  if (isDownloading) return
                  val metadata = currentMetadata ?: return
                  isDownloading = true
                  fetchBtn.isEnabled = false
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  progressBar.visibility = View.VISIBLE
                  progressDetailText.visibility = View.VISIBLE
                  progressBar.progress = 0
                  val threads = threadsSeekBar.progress + 1
                  statusText.text = "Starting $resolutionLabel with $threads threads..."

                  scope.launch {
                      val tempOutput = File(cacheDir, "${currentVideoId}_${resolutionLabel}_${System.currentTimeMillis()}.mp4")
                      try {
                          val downloader = GlobalContext.get().get<VideoDownloader>()
                          val config = Config(currentAbyssUrl, resolutionLabel, tempOutput, currentHeaders, threads)
                          withContext(Dispatchers.IO) {
                              downloader.downloadSegmentsInParallel(config, metadata) { pct, down, total, speed, msg ->
                                  scope.launch(Dispatchers.Main) {
                                      progressBar.progress = pct
                                      statusText.text = msg
                                      progressDetailText.text = "$pct%  •  ${down.formatAsReadableSize()} / ${total.formatAsReadableSize()}  •  ${speed.formatAsReadableSize()}/s"
                                  }
                              }
                          }
                          val savedName = "${currentVideoId}_${resolutionLabel}.mp4"
                          withContext(Dispatchers.IO) { saveToDownloads(tempOutput, savedName) }
                          progressBar.progress = 100
                          statusText.text = "Saved to Downloads/CDdm/$savedName"
                          Toast.makeText(this@MainActivity, "Download Complete!", Toast.LENGTH_LONG).show()
                      } catch (e: Throwable) {
                          statusText.text = "Download failed: ${e.message ?: e.javaClass.simpleName}"
                          if (tempOutput.exists()) tempOutput.delete()
                      } finally {
                          isDownloading = false
                          fetchBtn.isEnabled = true
                          window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      }
                  }
              }

              private fun saveToDownloads(sourceFile: File, fileName: String) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                          put(MediaStore.Downloads.MIME_TYPE, "video/mp4")
                          put(MediaStore.Downloads.RELATIVE_PATH, "${Environment.DIRECTORY_DOWNLOADS}/CDdm")
                      }
                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          ?: throw Exception("Failed to create MediaStore entry")
                      contentResolver.openOutputStream(uri)?.use { out ->
                          FileInputStream(sourceFile).use { input -> input.copyTo(out) }
                      }
                  } else {
                      val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "CDdm")
                      if (!dir.exists()) dir.mkdirs()
                      FileInputStream(sourceFile).use { input ->
                          FileOutputStream(File(dir, fileName)).use { out -> input.copyTo(out) }
                      }
                  }
                  sourceFile.delete()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore cddm-release.jks -alias cddm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cddm1234 -keypass cddm1234 \
            -dname "CN=CDdm, OU=Mobile, O=CDdm, L=IN, S=IN, C=IN"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp build/outputs/apk/release/*.apk CDdm.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDdm-APK
          path: CDdm.apk

      - name: Publish Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-${{ github.run_number }}
          name: CDdm APK v1.2-${{ github.run_number }}
          files: CDdm.apk
          draft: false
