          import org.koin.core.component.KoinComponent
          import org.koin.core.component.inject

          class MotchillProvider : Provider, KoinComponent {
              private val httpClientManager: HttpClientManager by inject()
              override fun getVideoID(url: String): String? {
                  val queryParam = url.fetchDocument()
                      .select("div.block-wrapper.text-center a")
                      .find { it.toString().contains("type=hii") }
                      ?.attr("data-href") ?: return null
                  val response = httpClientManager.postForm(
                      "https://motchill.taxi$queryParam",
                      "",
                      mapOf("x-requested-with" to "XMLHttpRequest", "Referer" to url)
                  )
                  return response.toJsoupDocument().getElementById("playerIframe")?.attr("src")?.getParameter("v")
              }
          }
